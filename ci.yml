name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every .ps1 is UTF-8 with BOM, and the source is ASCII-only
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem . -Recurse -Filter *.ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)

            # Windows PowerShell 5.1 reads a BOM-less .ps1 as ANSI (CP932 on a
            # Japanese system), so the BOM is not cosmetic. Check the raw bytes,
            # not the parser: an en-US runner happily parses a file that is
            # mis-decoded on CP932.
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "$($f.Name): missing UTF-8 BOM"
              $bad++
              continue
            }

            # This repo measures mojibake, so its own source stays ASCII-only.
            # Any Japanese text belongs in the result file, not in the script.
            for ($i = 3; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 0x7E) {
                Write-Host "$($f.Name): non-ASCII byte 0x$('{0:X2}' -f $bytes[$i]) at offset $i"
                $bad++
                break
              }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "byte check passed"

      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem . -Recurse -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $errs | ForEach-Object { Write-Host "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "parse check passed"

      - name: Run the deterministic part of the harness
        shell: pwsh
        run: ./cp932_pipe_test.ps1
